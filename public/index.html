<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111318">
    <title>Ani Web</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=94">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Ani Web</h1>
          <p id="statusText">Starting...</p>
        </div>
        <button id="refreshBtn" class="icon-button" type="button" title="Refresh library" aria-label="Refresh library">↻</button>
      </header>

      <main>
        <section id="libraryView" class="view active" aria-labelledby="libraryTitle">
          <div class="section-head">
            <h2 id="libraryTitle">Library</h2>
            <span id="libraryCount" class="counter">0</span>
          </div>
          <div class="library-tools">
            <select id="libraryFilter" aria-label="Filter library">
              <option value="all">All shows</option>
              <option value="continue">Up next</option>
              <option value="caughtup">Caught up</option>
              <option value="notstarted">Not started</option>
            </select>
            <select id="librarySort" aria-label="Sort library">
              <option value="new">New first</option>
              <option value="recent">Recently watched</option>
              <option value="progress">Progress</option>
              <option value="az">A-Z</option>
            </select>
          </div>
          <div id="libraryList" class="show-list"></div>
        </section>

        <section id="searchView" class="view" aria-labelledby="searchTitle">
          <div class="section-head">
            <h2 id="searchTitle">Discover</h2>
          </div>
          <form id="searchForm" class="search-row">
            <input id="searchInput" name="q" type="search" autocomplete="off" placeholder="Search anime">
            <button type="submit">Search</button>
          </form>
          <div class="browse-row" aria-label="Browse anime">
            <button class="browse-button" data-recommended="1" type="button">For you</button>
            <button class="browse-button" data-popular-range="0" type="button">Popular</button>
            <button class="browse-button" data-popular-range="1" type="button">Hot</button>
            <button class="browse-button" data-popular-range="7" type="button">Week</button>
            <button class="browse-button" data-popular-range="30" type="button">Month</button>
          </div>
          <div class="section-head compact watch-head">
            <div class="watch-title">
              <h2>Watching</h2>
              <span id="releaseWatchesCount" class="counter">0</span>
            </div>
            <div class="inline-actions">
              <button id="releaseWatchesCheckBtn" class="small-button" type="button">Check</button>
              <button id="releaseWatchesToggleBtn" class="small-button" type="button">Show</button>
            </div>
          </div>
          <div id="releaseWatchesList" class="watch-list" hidden></div>
          <div id="searchResults" class="show-list"></div>
        </section>

        <section id="settingsView" class="view" aria-labelledby="settingsTitle">
          <div class="section-head">
            <h2 id="settingsTitle">Settings</h2>
          </div>
          <form id="settingsForm" class="panel settings-grid">
            <label>
              <span>Mode</span>
              <select name="mode">
                <option value="sub">Sub</option>
                <option value="dub">Dub</option>
              </select>
            </label>
            <label>
              <span>Quality</span>
              <select name="quality">
                <option value="best">Best</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="worst">Worst</option>
              </select>
            </label>
            <label class="switch-row">
              <span>Auto-skip intro</span>
              <input name="skipIntro" type="checkbox">
            </label>
            <label class="switch-row">
              <span>Auto-mark watched on finish</span>
              <input name="autoTrackPlayed" type="checkbox">
            </label>
            <button type="submit">Save</button>
          </form>

          <details class="advanced-panel">
            <summary>Advanced</summary>
            <form id="commandForm" class="panel command-panel">
              <label>
                <span>ani-cli command</span>
                <input id="commandInput" name="command" type="text" placeholder='-q 720 -e 1 "one piece"'>
              </label>
              <button type="submit">Run</button>
            </form>

            <div class="section-head compact">
              <h2>Downloads</h2>
              <div class="inline-actions">
                <button id="downloadsBtn" class="small-button" type="button">Refresh</button>
              </div>
            </div>
            <div id="downloadsList" class="downloads-list"></div>

            <div class="section-head compact">
              <h2>Logs</h2>
              <div class="inline-actions">
                <button id="jobsBtn" class="small-button" type="button">Fetch</button>
                <button id="clearJobsBtn" class="small-button danger" type="button">Clear</button>
              </div>
            </div>
            <div id="jobsList" class="jobs-list"></div>
          </details>
        </section>
      </main>

      <nav class="tabbar" aria-label="Primary navigation">
        <button class="tab active" data-view="libraryView" type="button">Library</button>
        <button class="tab" data-view="searchView" type="button">Discover</button>
        <button class="tab" data-view="settingsView" type="button">Settings</button>
      </nav>
    </div>

    <dialog id="showDialog">
      <div class="dialog-head">
        <div>
          <h2 id="dialogTitle"></h2>
          <p id="dialogMeta"></p>
        </div>
        <button id="closeDialogBtn" class="icon-button" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <div class="episode-toolbar">
        <button id="downloadAllBtn" class="secondary" type="button">Download all</button>
        <button id="deleteAllDownloadsBtn" class="danger" type="button">Delete all</button>
      </div>
      <div id="episodeGrid" class="episode-list"></div>
    </dialog>

    <dialog id="detailsDialog">
      <div class="dialog-head">
        <div>
          <h2 id="detailsTitle"></h2>
          <p id="detailsMeta"></p>
        </div>
        <button id="closeDetailsBtn" class="icon-button" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <div id="detailsBody" class="details-body"></div>
    </dialog>

    <dialog id="playerDialog">
      <div class="dialog-head">
        <div>
          <h2 id="playerTitle">Playing</h2>
          <p class="player-hint">Streamed via ani-cli · close when done</p>
        </div>
        <button id="closePlayerBtn" class="icon-button" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <div class="player-stage" id="playerStage">
        <video id="playerVideo" playsinline></video>
        <div class="gesture-zone gesture-left" aria-hidden="true"></div>
        <div class="gesture-zone gesture-right" aria-hidden="true"></div>
        <div class="player-osd" id="playerOsd" aria-hidden="true"></div>
        <button id="skipButton" class="skip-button" type="button" hidden></button>
        <div class="center-controls" id="centerControls">
          <button id="prevEpisodeBtn" class="video-control-button previous-button" type="button" title="Previous episode" aria-label="Previous episode"></button>
          <button id="playPauseBtn" class="video-control-button play-center-button is-paused" type="button" title="Play" aria-label="Play"></button>
          <button id="nextEpisodeBtn" class="video-control-button next-button" type="button" title="Next episode" aria-label="Next episode"></button>
        </div>
        <div class="video-controls" id="videoControls">
          <span id="playerTime" class="player-time">0:00 / 0:00</span>
          <input id="playerSeek" class="player-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <button id="muteBtn" class="video-control-button volume-button" type="button" title="Mute" aria-label="Mute"></button>
          <input id="playerVolume" class="player-volume" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
          <button id="playerFullscreenBtn" class="video-control-button fullscreen-button" type="button" title="Fullscreen" aria-label="Fullscreen"></button>
        </div>
      </div>
      <div class="player-controls">
        <label class="player-autoplay">
          <input id="autoplayNext" type="checkbox" checked>
          <span>Autoplay next</span>
        </label>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/js/app.js?v=94"></script>
  </body>
</html>

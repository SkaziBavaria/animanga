name: Container Security

on:
  push:
    branches: [main, animanga-docker, ani-web-docker]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t animanga:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: animanga:ci
          format: spdx-json
          output-file: animanga.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: animanga-sbom
          path: animanga.spdx.json
          retention-days: 14

      - name: Scan image vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: animanga:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

name: Contract (upstream)

# Live checks against the Node provider adapters to detect upstream breakage.
# Runs on a schedule and on demand; not part of the PR gate.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install download runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run contract tests
        run: npm run test:contract

name: Contract (upstream)

# Live checks against the Node provider adapters to detect upstream breakage.
# Runs on a schedule and on demand; not part of the PR gate.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install provider and download runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl ffmpeg
          case "$(uname -m)" in
            x86_64) CURL_IMPERSONATE_ARCH=x86_64 ;;
            aarch64|arm64) CURL_IMPERSONATE_ARCH=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/lexiforest/curl-impersonate/releases/download/v1.5.6/curl-impersonate-v1.5.6.${CURL_IMPERSONATE_ARCH}-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod 0755 /usr/local/bin/curl_chrome136 /usr/local/bin/curl-impersonate
          curl_chrome136 --version

      - name: Run contract tests
        run: npm run test:contract

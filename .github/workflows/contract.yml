name: Contract (upstream)

# Live checks against AllAnime + ani-cli to detect upstream breakage.
# Runs on a schedule and on demand; not part of the PR gate.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_CONTRACT: '1'
      ANI_CLI_BIN: ani-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ani-cli and runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fzf ffmpeg aria2
          sudo curl -fsSL https://raw.githubusercontent.com/pystardust/ani-cli/master/ani-cli -o /usr/local/bin/ani-cli
          sudo chmod +x /usr/local/bin/ani-cli

      - name: Run contract tests
        run: npm run test:contract

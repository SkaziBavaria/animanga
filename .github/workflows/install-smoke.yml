name: Install smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test npm package install
        run: npm run test:smoke:npm

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke-test Docker Compose install
        run: npm run test:smoke:docker
